# ---- hosted (6) — this repo publishes /feeds/<id>.xml ----

[[sources]]
id = "arxiv-cl"
name = "arXiv cs.CL (LLM)"
mode = "hosted"
url = "https://rss.arxiv.org/rss/cs.CL"
site = "https://arxiv.org"
why = "arXiv offers no server-side keyword filter; this trims the cs.CL firehose to the LLM/agent subset."
note = "Kept for the LLM subset of the comp-ling firehose; topic-filtered server-side."

[sources.strategy]
name = "topic_filter"
terms = [
  "large language model", "language model", "llm", "llms", "foundation model",
  "alignment", "rlhf", "fine-tuning", "fine tuning", "instruction tuning",
  "in-context learning", "chain-of-thought", "chain of thought", "hallucination",
  "pre-training", "pretraining", "post-training", "prompt", "reasoning",
  "multimodal", "code generation", "code agent", "coding agent", "code model",
  "program synthesis", "program repair", "code repair", "coding assistant",
  "agentic", "software engineering agent", "software engineering benchmark",
  "sw-bench", "llm agent", "ai agent", "tool use", "tool-use", "function calling",
  "code completion", "copilot", "code reasoning", "code intelligence",
  "code benchmark",
]

[[sources]]
id = "arxiv-se"
name = "arXiv cs.SE (software engineering)"
mode = "hosted"
url = "https://rss.arxiv.org/rss/cs.SE"
site = "https://arxiv.org"
why = "Same shape as arxiv-cl: the cs.SE firehose trimmed to the code/SE subset."
note = "The code/SE subset, same topic filter approach."

[sources.strategy]
name = "topic_filter"
terms = [
  "code generation", "code agent", "coding agent", "code model",
  "program synthesis", "program repair", "code repair", "coding assistant",
  "agentic", "software engineering agent", "software engineering benchmark",
  "sw-bench", "sw bench", "llm agent", "ai agent", "tool use", "tool-use",
  "function calling", "code completion", "copilot", "code review",
  "code reasoning", "code intelligence", "code benchmark",
  "large language model", "language model", "llm", "llms",
]

[[sources]]
id = "hf-daily-papers"
name = "Hugging Face Daily Papers"
mode = "hosted"
url = "https://huggingface.co/api/daily_papers"
site = "https://huggingface.co/papers"
why = "No first-party feed exists (every feed path 401s); the keyless JSON API is the only upstream."
note = "Staff-curated daily AI paper list; no first-party feed exists, so this repo renders one."

[sources.strategy]
name = "json_api"
item = "$"
title = "paper.title"
link = "paper.id"
date = "paper.submittedOnDailyAt"
summary = "paper.summary"
upvotes = "paper.upvotes"

