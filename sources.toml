# The source registry — the single source of truth for everything this
# repo knows about feeds. Replaces the digest-era categories/*.json.
#
#   mode = "direct"  the `url` is itself what a reader subscribes to;
#                    nothing is generated or fetched for it here
#   mode = "hosted"  this repo publishes a feed for it at /feeds/<id>.xml
#                    (a `why` is required: what forces the hosting)
#
# Registry order is display order (index, OPML, direct table).
# `id` is permanent: it is the public path /feeds/<id>.xml and the OPML key.
#
# Optional fields: `site` (human page), `note` (why the source is worth
# following; becomes the hosted feed's <description> when present), and
# for hosted sources a `strategy` block naming the fetch/transform shape.

[feed]
title = "Jenny's source log"
link = "https://jennymaeleidig.github.io/news-digest-agent/"
language = "en"
description = "Feeds this site publishes, and the sources behind them. The registry is sources.toml in the repo."
description_template = "Items from {name}, part of Jenny's source log."

